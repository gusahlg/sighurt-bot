[package]
name = "discord-bot"
version = "0.1.0"
edition = "2021"
description = "A Discord moderation bot using Twilight, optimized for Raspberry Pi"

[dependencies]
# Twilight Discord framework (minimal features)
twilight-gateway = "0.15"
twilight-http = "0.15"
twilight-model = "0.15"

# Async runtime (minimal features for Pi 4)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Database
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15"

# Logging (minimal)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Performance optimizations
aho-corasick = "1"
parking_lot = "0.12"
lru = "0.12"
time = { version = "0.3", features = ["formatting"] }

# HTTP client used by the chat module to call the SuperSighurt LLM server.
# rustls (not native-tls) to avoid pulling OpenSSL onto the Pi build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Voice: Songbird (Twilight integration) drives Discord voice — joining
# channels, decoding incoming Opus to 48kHz stereo PCM, and shipping outgoing
# PCM. `receive` is required for the VoiceTick event (decoded mic audio);
# `rustls` keeps us off OpenSSL on the Pi.
songbird = { version = "0.4", default-features = false, features = ["twilight", "rustls", "driver", "gateway", "receive"] }
symphonia-core = "0.5"

# WebSocket client for ElevenLabs Conversational AI.
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures = "0.3"

# Songbird's EventHandler trait is `async_trait`-based.
async-trait = "0.1"

# Base64 frame encoding for ElevenLabs audio chunks.
base64 = "0.22"

# JSON for hand-rolled ElevenLabs WS messages.
serde_json = "1"

# systemd readiness + watchdog pings (no-op outside systemd).
sd-notify = "0.4"

# AI mode support (feature-gated for optional build)
[features]
default = []
ai = []

[profile.release]
opt-level = "s"          # Optimize for size (better for Pi 4 cache)
lto = true               # Link-time optimization
codegen-units = 1        # Single codegen unit for better optimization
strip = true             # Strip symbols
panic = "abort"          # Smaller binary, no unwinding

[profile.release-fast]
inherits = "release"
opt-level = 3            # Maximum speed (use for AI-heavy workloads)
